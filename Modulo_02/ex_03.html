<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cards de Produtos</title>
    <link rel="stylesheet" href="css/stylesEx_03.css">
</head>
<body>

    <h1>Produtos</h1>

    <div class="controls">
        <button onclick="filtrarEletronicos()">Mostrar só eletrônicos</button>
        <button onclick="limparCards()">Limpar</button>
    </div>

    <div class="add">
        <input type="text" id="nome" placeholder="Nome">
        <input type="number" id="preco" placeholder="Preço">
        <input type="text" id="categoria" placeholder="Categoria">
        <button onclick="adicionarProduto()">Adicionar</button>
    </div>

    <div id="container"></div>

    <script src="js/scriptEx_03.js"></script>
</body>
</html>
